# filestoragetransfer properties file

#######################################################################################################
# Default Labels for XPage
filestoragetransfer.pageTitle=filestoragetransfer
filestoragetransfer.pagePathLabel=filestoragetransfer

daemon.FileStorageTransferDaemon.interval=86400
daemon.FileStorageTransferDaemon.onstartup=1

filestoragetransfer.RetryLimit=3
filestoragetransfer.UploadLimit=2

# Retry delay in seconds
filestoragetransfer.RetryDelay=86400

# Mail notification
filestoragetransfer.NotificationsEnabled=true

# Mail configuration (if notifications are enabled)
filestoragetransfer.MailSubject=File Storage Transfer error
filestoragetransfer.MailSender=webmaster@localhost
filestoragetransfer.MailRecipient=webmaster@localhost
# Number of items per page in the back office lists
filestoragetransfer.listItems.itemsPerPage=50

# Labels of the file store service providers shown by the back office (a text or an #i18n{key}): one key
# filestore.<provider name>.label per provider; a provider without label is shown by its technical name. Any plugin
# may ship the label of its own providers, the site overrides them (WEB-INF/conf/override, environment).
filestore.defaultDatabaseFileStoreProvider.label=#i18n{filestoragetransfer.filestore.defaultDatabaseFileStoreProvider}
filestore.fileGeneratorDatabaseFileStoreProvider.label=#i18n{filestoragetransfer.filestore.fileGeneratorDatabaseFileStoreProvider}
